version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
    rust: "latest"
  jobs:
    pre_build:
        - cargo install svgbob_cli
        # No reshim for jobs.pre_build, only jobs.build
        - asdf reshim rust

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements.txt
